<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NetPos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NetPos</title>
  <!-- Fundo: quadrado arredondado azul sólido -->
  <rect width="64" height="64" rx="12" fill="#3c8dbc"/>
  <!-- Letra N desenhada como uma rede: 3 linhas ligam 4 nós -->
  <path d="M18 46V18L46 46V18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nós da rede -->
  <circle cx="18" cy="46" r="5.5" fill="#ffffff"/>
  <circle cx="18" cy="18" r="5.5" fill="#ffffff"/>
  <circle cx="46" cy="46" r="5.5" fill="#ffffff"/>
  <!-- Nó verde = venda concluída (cor de sucesso do sistema) -->
  <circle cx="46" cy="18" r="6.5" fill="#00a65a" stroke="#ffffff" stroke-width="2.5"/>
</svg>
